<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Penguin sprite sheet</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  canvas { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="sheet"></canvas>
<script>
// Emperor penguin sprite sheet.
// Everything is drawn on a 32x32 pixel grid and blitted at SCALE with hard
// edges, so the PNG keys cleanly against a transparent-color window later.

var GRID = 32;
var SCALE = 4;
var CELL = GRID * SCALE;
var COLS = 6;
var ROWS = 3;

var BLACK  = '#23252e';
var SHADE  = '#171920';
var WHITE  = '#f7f4ec';
var CREAM  = '#e6e0d2';
var ORANGE = '#f2a03d';
var DEEP   = '#d4822a';
var YELLOW = '#f8d86a';
var EYE    = '#12131a';

var canvas = document.getElementById('sheet');
canvas.width = CELL * COLS;
canvas.height = CELL * ROWS;
var ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---- pixel grid helpers -------------------------------------------------

function newGrid() {
  var g = new Array(GRID * GRID);
  for (var i = 0; i < g.length; i++) g[i] = null;
  return g;
}

function px(g, x, y, c) {
  x = Math.round(x); y = Math.round(y);
  if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
  g[y * GRID + x] = c;
}

function rect(g, x, y, w, h, c) {
  for (var j = 0; j < h; j++)
    for (var i = 0; i < w; i++) px(g, x + i, y + j, c);
}

// Hard-edged ellipse: a pixel is in if its centre falls inside the radius.
function ellipse(g, cx, cy, rx, ry, c) {
  var x0 = Math.floor(cx - rx), x1 = Math.ceil(cx + rx);
  var y0 = Math.floor(cy - ry), y1 = Math.ceil(cy + ry);
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var dx = (x + 0.5 - cx) / rx;
      var dy = (y + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1.0) px(g, x, y, c);
    }
  }
}

// ---- the penguin --------------------------------------------------------
// opts: { step: 0..1 walk phase, bob: vertical offset, turn: -1|0|1 head,
//         blink: bool, flap: -1..1 flipper lift, facing: 1 }

function drawPenguin(opts) {
  var g = newGrid();
  var bob = opts.bob || 0;
  var turn = opts.turn || 0;
  var step = opts.step === undefined ? -1 : opts.step;
  var flap = opts.flap || 0;

  // --- feet (drawn first, they sit behind the body silhouette)
  var lx = 12, rx = 17, fy = 28 + bob;
  if (step >= 0) {
    var swing = Math.sin(step * Math.PI * 2);
    lx = 12 + Math.round(swing * 2);
    rx = 17 - Math.round(swing * 2);
  }
  rect(g, lx, fy, 4, 2, ORANGE);
  rect(g, lx, fy + 2, 5, 1, DEEP);
  rect(g, rx, fy, 4, 2, ORANGE);
  rect(g, rx, fy + 2, 5, 1, DEEP);

  // --- flippers behind the body
  var flapY = Math.round(flap * 2);
  ellipse(g, 7.5, 19 + bob + flapY, 2.2, 5.5, SHADE);
  ellipse(g, 24.5, 19 + bob - flapY, 2.2, 5.5, SHADE);

  // --- body and head silhouette
  ellipse(g, 16, 20 + bob, 8, 8.5, BLACK);
  ellipse(g, 16, 10 + bob, 6.2, 6.2, BLACK);

  // --- white belly
  ellipse(g, 16, 20.5 + bob, 5.4, 6.8, WHITE);
  ellipse(g, 16, 24 + bob, 5.0, 3.4, CREAM);

  // --- auricular patches, the emperor's signature
  ellipse(g, 16 - 4.6 + turn * 0.6, 11 + bob, 1.9, 3.0, YELLOW);
  ellipse(g, 16 + 4.6 + turn * 0.6, 11 + bob, 1.9, 3.0, YELLOW);

  // --- face bib, a pale wash under the chin
  ellipse(g, 16 + turn * 0.8, 14 + bob, 3.6, 1.8, CREAM);

  // --- eyes
  var ex = 16 + turn * 1.6;
  if (opts.blink) {
    rect(g, ex - 4, 9 + bob, 2, 1, EYE);
    rect(g, ex + 2, 9 + bob, 2, 1, EYE);
  } else {
    rect(g, ex - 4, 8 + bob, 2, 2, WHITE);
    rect(g, ex + 2, 8 + bob, 2, 2, WHITE);
    px(g, ex - 4 + (turn > 0 ? 1 : 0), 8 + bob + 1, EYE);
    px(g, ex + 2 + (turn > 0 ? 1 : 0), 8 + bob + 1, EYE);
  }

  // --- beak, leans the way the head is turned
  var bx = 16 + turn * 2;
  rect(g, bx - 1, 11 + bob, 3, 2, ORANGE);
  rect(g, bx - 1 + (turn > 0 ? 1 : (turn < 0 ? -1 : 0)), 13 + bob, 2, 1, DEEP);

  return g;
}

function blit(g, col, row) {
  var ox = col * CELL, oy = row * CELL;
  for (var y = 0; y < GRID; y++) {
    for (var x = 0; x < GRID; x++) {
      var c = g[y * GRID + x];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(ox + x * SCALE, oy + y * SCALE, SCALE, SCALE);
    }
  }
}

// ---- rows ---------------------------------------------------------------

// Row 0 - walk cycle, facing right
for (var i = 0; i < COLS; i++) {
  var phase = i / COLS;
  blit(drawPenguin({
    step: phase,
    bob: (i === 1 || i === 4) ? -1 : 0,
    turn: 1,
    flap: Math.sin(phase * Math.PI * 2) * 0.8
  }), i, 0);
}

// Row 1 - idle, with a blink partway through
var idleBob  = [0, 0, -1, 0, 0, 0];
var idleBlink = [false, false, false, true, false, false];
for (var i = 0; i < COLS; i++) {
  blit(drawPenguin({
    step: -1,
    bob: idleBob[i],
    turn: 0,
    blink: idleBlink[i],
    flap: i === 2 ? 0.4 : 0
  }), i, 1);
}

// Row 2 - looking around
var lookTurn = [0, -1, -1, 0, 1, 1];
var lookBlink = [false, false, true, false, false, true];
for (var i = 0; i < COLS; i++) {
  blit(drawPenguin({
    step: -1,
    bob: 0,
    turn: lookTurn[i],
    blink: lookBlink[i],
    flap: (i === 1 || i === 4) ? 0.5 : 0
  }), i, 2);
}

document.title = 'ready';
</script>
</body>
</html>
